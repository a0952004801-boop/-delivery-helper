<!doctype html>

<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111827">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>外送助手 v0.2</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

background:#0b0f14;

color:#fff;

font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

.wrap{max-width:720px;margin:auto;padding:18px}

h1{font-size:30px;margin:8px 0 2px}

.sub,.muted{color:#94a3b8;font-size:13px}

.card{

background:#111827;

border:1px solid #263244;

border-radius:18px;

padding:16px;

margin:12px 0

}

.active{border-color:#22c55e}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px

}

.stat{

background:#0f172a;

border-radius:14px;

padding:12px

}

.stat small{color:#94a3b8}

.stat b{

display:block;

font-size:22px;

margin-top:5px

}

.timer{

text-align:center;

font-size:40px;

font-weight:800;

margin:10px 0

}

.row{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px

}

label{

display:block;

color:#cbd5e1;

font-size:13px;

margin-bottom:6px

}

input{

width:100%;

padding:12px;

border-radius:12px;

border:1px solid #334155;

background:#0b1220;

color:#fff;

font-size:16px

}

button{

width:100%;

padding:15px;

border:0;

border-radius:15px;

font-size:17px;

font-weight:800;

margin-top:8px

}

.start{background:#22c55e;color:#06240f}

.finish{background:#ef4444;color:#fff}

.add{background:#2563eb;color:#fff}

.secondary{background:#1f2937;color:#fff}

.buttons{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px

}

.warning{

color:#fbbf24;

font-size:12px;

line-height:1.5

}

.order{

background:#0f172a;

border:1px solid #334155;

border-radius:14px;

padding:12px;

margin-top:10px

}

.done{opacity:.65}

.orderhead{

display:flex;

justify-content:space-between;

align-items:center

}

.amount{font-weight:800}

.trip{

background:#0f172a;

border-radius:12px;

padding:12px;

margin-top:8px;

font-size:14px

}

</style>

</head>

<body>

<div class="wrap">

<h1>外送助手 <small>v0.2</small></h1>

<div class="sub">

五張疊單・獨立計時・GPS里程・補貼差額估算

</div>

<div class="grid">

<div class="stat">

<small>今日趟次</small>

<b id="statTrips">0</b>

</div>

<div class="stat">

<small>今日訂單</small>

<b id="statOrders">0</b>

</div>

<div class="stat">

<small>今日收入</small>

<b id="statIncome">$0</b>

</div>

<div class="stat">

<small>今日里程</small>

<b id="statKm">0.00 km</b>

</div>

<div class="stat">

<small>估算金額</small>

<b id="statEstimate">$0</b>

</div>

<div class="stat">

<small>估算差額</small>

<b id="statDiff">$0</b>

</div>

</div>

<div class="card" id="activeCard">

<div class="muted">本趟總時間</div>

<div class="timer" id="timer">

00:00:00

</div>

<div class="muted" id="gpsStatus">

GPS 尚未啟動

</div>

<div style="margin-top:12px">

<label>GPS里程</label>

<input

id="liveKm"

value="0.00 km"

readonly

>

</div>

<div id="ordersArea"></div>

<button

id="startButton"

class="start">

第1張接單開始

</button>

<button

id="addButton"

class="add"

style="display:none">

＋ 加入第2張疊單

</button>

</div>

<div class="card">

<div class="row">

<div>

<label>

本趟 Uber 基本報酬

</label>

<input

id="income"

type="number"

inputmode="decimal"

placeholder="例如 120"

>

</div>

<div>

<label>

手動里程 km

</label>

<input

id="manualKm"

type="number"

inputmode="decimal"

step="0.1"

placeholder="GPS不準時填"

>

</div>

</div>

<p class="muted">

每張訂單從自己的加入時間開始，

到該張完成為止，

固定以 4.1 元／分鐘計算。

</p>

<p class="warning">

此為個人自訂核算工具，

不代表 Uber Eats 或政府正式補貼計算方式。

</p>

<button

id="closeTripButton"

class="finish"

style="display:none">

結束本趟並儲存

</button>

</div>

<div class="buttons">

<button

class="secondary"

id="exportButton">

匯出 CSV

</button>

<button

class="secondary"

id="clearButton">

清除今日資料

</button>

</div>

<div class="card">

<b>今日外送紀錄</b>

<div id="tripList">

<div class="muted" style="margin-top:10px">

今天還沒有紀錄

</div>

</div>

</div>

<div class="warning">

iPhone 切到背景或鎖定螢幕時，

GPS可能暫停。

計時採實際時間戳記，

重新開啟後會自動追上時間。

</div>

</div>

<script>

const KEY="delivery-helper-v02"

let data=load()

let timerInterval=null

let gpsWatch=null

let lastPosition=null

function blankData(){

return{

active:null,

trips:[]

}

}

function load(){

try{

return JSON.parse(

localStorage.getItem(KEY)

)||blankData()

}catch(e){

return blankData()

}

}

function save(){

localStorage.setItem(

KEY,

JSON.stringify(data)

)

}

function today(){

const d=new Date()

return(

d.getFullYear()

+"-"+

String(d.getMonth()+1).padStart(2,"0")

+"-"+

String(d.getDate()).padStart(2,"0")

)

}

function clock(ms){

const d=new Date(ms)

return(

String(d.getHours()).padStart(2,"0")

+":"+

String(d.getMinutes()).padStart(2,"0")

)

}

function duration(ms){

let s=Math.max(

0,

Math.floor(ms/1000)

)

let h=Math.floor(s/3600)

let m=Math.floor(

(s%3600)/60

)

let sec=s%60

return(

String(h).padStart(2,"0")

+":"+

String(m).padStart(2,"0")

+":"+

String(sec).padStart(2,"0")

)

}

function orderMinutes(order){

const end=

order.endedAt||

Date.now()

return(

(end-order.startedAt)

/60000

)

}

function orderEstimate(order){

return(

orderMinutes(order)

*4.1

)

}

function distance(a,b){

const R=6371

const rad=x=>

x*Math.PI/180

const dLat=

rad(b.lat-a.lat)

const dLon=

rad(b.lon-a.lon)

const x=

Math.sin(dLat/2)**2

+

Math.cos(rad(a.lat))

*

Math.cos(rad(b.lat))

*

Math.sin(dLon/2)**2

return(

2*

R*

Math.asin(

Math.sqrt(x)

)

)

}

function startGPS(){

if(

!navigator.geolocation

){

gpsStatus.textContent=

"此裝置不支援GPS"

return

}

gpsWatch=

navigator.geolocation.watchPosition(

function(position){

const accuracy=

position.coords.accuracy

gpsStatus.textContent=

"GPS已啟動，精度約 "

+

Math.round(accuracy)

+

" 公尺"

if(

accuracy>80||

!data.active

){

return

}

const current={

lat:position.coords.latitude,

lon:position.coords.longitude

}

if(lastPosition){

const km=

distance(

lastPosition,

current

)

if(km<1.5){

data.active.km+=km

save()

}

}

lastPosition=current

},

function(){

gpsStatus.textContent=

"GPS無法使用，請允許位置權限"

},

{

enableHighAccuracy:true,

maximumAge:5000,

timeout:15000

}

)

}

function stopGPS(){

if(gpsWatch!==null){

navigator.geolocation.clearWatch(

gpsWatch

)

}

gpsWatch=null

lastPosition=null

}

function startTrip(){

const now=Date.now()

data.active={

startedAt:now,

km:0,

orders:[

{

id:1,

startedAt:now,

endedAt:null

}

]

}

income.value=""

manualKm.value=""

save()

startGPS()

startTimer()

render()

}

function addOrder(){

if(

!data.active||

data.active.orders.length>=5

){

return

}

const id=

data.active.orders.length+1

data.active.orders.push({

id:id,

startedAt:Date.now(),

endedAt:null

})

save()

render()

}

function finishOrder(id){

const order=

data.active.orders.find(

x=>x.id===id

)

if(

!order||

order.endedAt

){

return

}

order.endedAt=

Date.now()

save()

render()

}

function startTimer(){

clearInterval(

timerInterval

)

timerInterval=

setInterval(

render,

1000

)

}

function closeTrip(){

if(!data.active){

return

}

const unfinished=

data.active.orders.filter(

o=>!o.endedAt

)

if(unfinished.length){

alert(

"還有 "+

unfinished.length+

" 張訂單尚未完成"

)

return

}

let km=

data.active.km||0

const manual=

Number(

manualKm.value

)

if(manual>0){

km=manual

}

const tripIncome=

Number(

income.value

)||0

const estimate=

data.active.orders.reduce(

(sum,o)=>

sum+

orderEstimate(o),

0

)

const endedAt=

Math.max(

...data.active.orders.map(

o=>o.endedAt

)

)

data.trips.push({

date:today(),

startedAt:

data.active.startedAt,

endedAt:endedAt,

orders:

data.active.orders,

km:km,

income:

tripIncome,

estimate:

estimate,

diff:

Math.max(

0,

estimate-tripIncome

)

})

data.active=null

stopGPS()

clearInterval(

timerInterval

)

save()

render()

}

function render(){

const trips=

data.trips.filter(

t=>t.date===today()

)

let totalIncome=0

let totalKm=0

let totalEstimate=0

let totalDiff=0

let totalOrders=0

trips.forEach(t=>{

totalIncome+=t.income

totalKm+=t.km

totalEstimate+=t.estimate

totalDiff+=t.diff

totalOrders+=

t.orders.length

})

statTrips.textContent=

trips.length

statOrders.textContent=

totalOrders

statIncome.textContent=

"$"+

Math.round(totalIncome)

statKm.textContent=

totalKm.toFixed(2)

+" km"

statEstimate.textContent=

"$"+

Math.round(totalEstimate)

statDiff.textContent=

"$"+

Math.round(totalDiff)

if(data.active){

activeCard.classList.add(

"active"

)

startButton.style.display=

"none"

timer.textContent=

duration(

Date.now()

-

data.active.startedAt

)

liveKm.value=

data.active.km.toFixed(2)

+" km"

ordersArea.innerHTML=

data.active.orders.map(

order=>`

<div class="order ${order.endedAt?"done":""}">

<div class="orderhead">

<b>

第${order.id}張

${order.id>1?"疊單":""}

</b>

<span class="amount">

$${orderEstimate(order).toFixed(1)}

</span>

</div>

<div class="muted">

加入

${clock(order.startedAt)}

｜

${

order.endedAt

?

"完成 "+clock(order.endedAt)

:

"進行中 "+duration(Date.now()-order.startedAt)

}

</div>

${

order.endedAt

?

""

:

`

<button

class="finish"

onclick="finishOrder(${order.id})">

完成第${order.id}張

</button>

`

}

</div>

`

).join("")

if(

data.active.orders.length<5

){

addButton.style.display=

"block"

addButton.textContent=

"＋ 加入第"+

(data.active.orders.length+1)+

"張疊單"

}else{

addButton.style.display=

"none"

}

closeTripButton.style.display=

data.active.orders.every(

o=>o.endedAt

)

?

"block"

:

"none"

}else{

activeCard.classList.remove(

"active"

)

startButton.style.display=

"block"

addButton.style.display=

"none"

closeTripButton.style.display=

"none"

ordersArea.innerHTML=""

timer.textContent=

"00:00:00"

liveKm.value=

"0.00 km"

gpsStatus.textContent=

"GPS 尚未啟動"

}

if(!trips.length){

tripList.innerHTML=

'<div class="muted" style="margin-top:10px">今天還沒有紀錄</div>'

}else{

tripList.innerHTML=

trips

.slice()

.reverse()

.map(t=>`

<div class="trip">

<b>

${clock(t.startedAt)}

→

${clock(t.endedAt)}

</b>

<br>

${t.orders.length}

張訂單

｜

${t.km.toFixed(2)}

km

｜

收入

$${Math.round(t.income)}

<br>

估算

$${t.estimate.toFixed(1)}

｜

差額

$${t.diff.toFixed(1)}

<br>

<span class="muted">

${

t.orders.map(

o=>

"第"+

o.id+

"張 "+

orderMinutes(o).toFixed(1)+

"分 / $"+

orderEstimate(o).toFixed(1)

).join("；")

}

</span>

</div>

`).join("")

}

}

function exportCSV(){

const rows=[

[

"日期",

"開始",

"結束",

"訂單數",

"里程",

"收入",

"估算",

"差額"

]

]

data.trips.forEach(t=>{

rows.push([

t.date,

clock(t.startedAt),

clock(t.endedAt),

t.orders.length,

t.km.toFixed(2),

t.income.toFixed(2),

t.estimate.toFixed(2),

t.diff.toFixed(2)

])

})

const csv=

"\\ufeff"+

rows.map(

r=>

r.map(

v=>

'"'+

String(v).replaceAll(

'"',

'""'

)

+'"'

).join(",")

).join("\\n")

const blob=

new Blob(

[csv],

{

type:

"text/csv;charset=utf-8"

}

)

const a=

document.createElement("a")

a.href=

URL.createObjectURL(blob)

a.download=

"外送助手_"+

today()+

".csv"

a.click()

}

startButton.onclick=

startTrip

addButton.onclick=

addOrder

closeTripButton.onclick=

closeTrip

exportButton.onclick=

exportCSV

clearButton.onclick=

function(){

if(

confirm(

"確定清除今天已完成的紀錄？"

)

){

data.trips=

data.trips.filter(

t=>t.date!==today()

)

save()

render()

}

}

if(data.active){

startGPS()

startTimer()

}

render()

</script>

</body>

</html>
